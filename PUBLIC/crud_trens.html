

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD TRENS</title>
    <link rel="stylesheet" href="../assets/style/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light p-4">
    <div class="container bg-light p-4 rounded shadow-sm" style="max-width: 900px;">
        <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
            <h2 class="h4 m-0">SISTEMA DE TRENS</h2>
            <div class="d-flex align-items-center gap-2">
                <label for="perfil" class="form-label mb-0 fw-bold">Perfil Atual:</label>
                <select id="perfil" class="form-select form-select-sm w-auto" onchange="alternarperfil()">
                    <option value="ADMIN">Administrador</option>
                    <option value="USUAR">Usuário padrão</option>
                </select>
            </div>
        </div>
        <div id="secao-formulario" class="mb-4">
            <h5 id="form-titulo">CADASTRAR TREM</h5>
            <form id="form-trem" class="=row g-3">
                <input type="hidden" id="trem-id">
                
                <div class="col md-6">
                    <label class="form-label">NOME DO TREM</label>
                    <input type="text" id="nome" class="form-control" required>
                </div>

                <div class="col md-3">
                    <label class="form-label"> TELEFONE DA UNIDADE</label>
                    <input type="text" id="telefone" class="form-control" placeholder="(00)00000-0000" required>
                </div>
                <div class="col md-3">
                    <label class="form-label">DATA DA FABRICAÇÃO</label>
                    <input type="date" id="nascimento" class="form-control" required>
                </div>
                <div class="col md-4">
                    <label class="form-label">TIPO</label>
                    <select id="tipo" class="form-select" required>
                        <option value="Passageiros">Passageiros</option>
                        <option value="Carga">Carga</option>
                        <option value="Turístico">Turístico</option>
                    </select>
                </div>
                <div class="col md-4">
                    <label class="form-label">CIDADE / UF</label>
                    <div class="input-group">
                        <input type="text" id="cidade" class="form-control" placeholder="Cidade" required>
                        <input type="text" id="estado" class="form-control" placeholder="UF" maxlength="2" style="max-width: 60px;" required>
                    </div>
                </div>
                <div class="col md-4">
                    <label class="form-label">USUÁRIO RESPONSÁVEL</label>
                    <select id="usuario_responsavel" class="form-select" required>
                    </select>
                </div>
                <div class="col-12 text-end">
                    <button type="button" class="btn btn-secondar btn-sm" onclick="LimparFormulario()">CANCELAR</button>
                    <button type="submit" id="btn-salvar" class="btn btn-primary btn-sm">SALVAR TREM</button>
                </div>
            </form>
        </div>
        <h5 class="mb-3">TRENS CADASTRADOS</h5>
        <div class="table-responssive">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>NOME</th>
                        <th>TIPO</th>
                        <th>FABRICAÇÂO</th>
                        <th>CIDADE/UF</th>
                        <th>RESPONSÁVEL</th>
                        <th class="col-acoes">AÇÕES</th>
                    </tr>
                </thead>
                <tbody id="tabela-trens">
                </tbody>
            </table>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../SCRIPTS/script-crud-trens.js"></script>
</body>
</html>
